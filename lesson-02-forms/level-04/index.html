<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lesson 02 — Level 04</title>
  </head>
  <body>
    <h1>Level 04 — Input Types</h1>
    <form>
      <!-- TODO: Add inputs using types: email, tel, password, number, range, file -->
       <label="email">Enter your email: <br /></label>
       <input type="email"><br>

       <label="phone">Enter your phone number:<br /></label>
       <input type="tel"><br>

       <label="password">Enter your password:<br /></label>
       <input type="password"><br>

       <label="tentacles">Number of tentacles (1-100):<br /></label>
       <input type="number" min="10" max="100" step="2"><br>

       <label="range">Volume:<br /></label>
       <input name="volume" type="range" min="0" max="100"><br>

       <label="file">Choose file<br /></label>
       <input type="file"><br>
      
    </form>
  </body>
</html>
