<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lesson 02 — Level 07</title>
  </head>
  <body>
    <h1>Level 07 — Labels & Accessibility</h1>
    <form>
      <!-- TODO: Attach labels to controls. Use <label for="id"> or wrap the input inside <label>. -->
       <fieldset>
          <legend>Choose your pay rate</legend>
          <label for="highEnd">High End</label>
          <input id="highEnd" type="radio" name="pRate"/>

          <label for="lowEnd">Low End</label>
          <input id="lowEnd" type="radio" name="pRate"/><br>
        </fieldset>

          <label for="includeBenefits">Include Benefits</label>
          <input id="includeBenefits" type="checkbox"/>

          <label for="excludeBenefits">Do not include benefits</label>
          <input id="excludeBenefits" type="checkbox"/>
          <button type="submit">Submit</button>
       
    </form>
  </body>
</html>
